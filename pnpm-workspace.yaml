packages:
  - demos/*
  - docs
  - examples/*
  - packages/*
  - tools/*

# https://pnpm.io/settings#blockexoticsubdeps
blockExoticSubdeps: true

# Pin exact versions on install — no caret ranges.
saveExact: true

# https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 1440

# https://pnpm.io/catalogs
catalog:
  "@a2a-js/sdk": 0.3.13
  "@hono/node-server": 2.0.6
  "@hono/standard-validator": 0.2.2
  bit-buffers: 1.0.2
  hono: 4.12.27
  jose: 6.2.3
  safe-stable-stringify: 2.5.0
  standard-matchers: 0.1.0
  uuid: 14.0.1
  valibot: 1.4.1
  viem: 2.53.1
  web-identity-schemas: 0.3.0
  zod: 4.4.3

# Force patched versions of vulnerable transitive dependencies (pnpm audit).
# Scoped by major where multiple vulnerable lines coexist in the tree.
# https://pnpm.io/settings#overrides
overrides:
  "body-parser@1": "^1.20.3"
  "body-parser@2": "^2.2.1"
  "path-to-regexp@0.1": "^0.1.13"
  "qs@6": "^6.15.2"
  "picomatch@2": "^2.3.2"
  "picomatch@4": "^4.0.4"
  "js-yaml@4": "^4.2.0"
  # read-yaml-file@1.x pins js-yaml 3.x (vulnerable, uses removed safeLoad);
  # 2.1.0 is the latest CommonJS line and uses js-yaml 4.x.
  "read-yaml-file@1": "^2.1.0"
  "ws@8": "^8.20.1"
  "uuid@11": "^11.1.1"
  "tar@7": "^7.5.16"
  rollup: "^4.59.0"
  vite: "^7.3.5"
  postcss: "^8.5.10"
  esbuild: "^0.25.0"
  jsondiffpatch: "^0.7.2"
  js-yaml@<3.15.0: ^3.15.0
  adm-zip@<0.6.0: ^0.6.0
  '@hono/node-server@>=2.0.0 <=2.0.9': ^2.0.10
  axios@>=1.0.0 <1.18.0: ^1.18.0
  axios@>=1.13.0 <1.18.0: ^1.18.0
  axios@>=1.15.0 <1.18.0: ^1.18.0
  axios@>=1.15.1 <1.18.0: ^1.18.0
  axios@>=1.15.2 <1.18.0: ^1.18.0
  axios@>=1.7.0 <1.18.0: ^1.18.0
  body-parser@<1.20.6: ^1.20.6
  brace-expansion@<1.1.16: ^1.1.16
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@<1.1.18: ^1.1.18
  fast-uri@>=3.0.0 <3.1.3: ^3.1.3
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  fast-uri@>=3.0.0 <=3.1.3: ^3.1.4
  hono@<4.12.34: ^4.12.34
  hono@>=3.8.0 <4.12.34: ^4.12.34
  hono@>=4.12.0 <4.12.34: ^4.12.34
  hono@>=4.7.0 <4.12.34: ^4.12.34
  ip-address@<=10.3.0: ^10.3.1
  ip-address@>=10.1.1 <=10.2.0: ^10.2.1
  ip-address@>=10.1.1 <=10.2.1: ^10.2.2
  js-yaml@>=3.0.0 <3.15.1: ^3.15.1
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@<3.3.16: ^3.3.16
  nanoid@<3.3.17: ^3.3.17
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  sharp@<0.35.0: ^0.35.0
  socket.io-parser@>=4.0.0 <4.2.7: ^4.2.7
  tar@<=7.5.16: ^7.5.17
  tar@<=7.5.17: ^7.5.18
  tar@<=7.5.18: ^7.5.19
  tar@<=7.5.20: ^7.5.21
  valibot@<=1.4.1: ^1.4.2

allowBuilds:
  better-sqlite3: true
  esbuild: true
  keytar: false
  puppeteer: false
  sharp: false

minimumReleaseAgeExclude:
