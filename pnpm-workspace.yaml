packages:
  - demos/*
  - docs
  - examples/*
  - packages/*
  - tools/*

# https://pnpm.io/settings#blockexoticsubdeps
blockExoticSubdeps: true

# Pin exact versions on install — no caret ranges.
saveExact: true

# https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 1440

# https://pnpm.io/catalogs
catalog:
  "@a2a-js/sdk": 0.3.13
  "@hono/node-server": 2.1.1
  "@hono/standard-validator": 0.4.0
  bit-buffers: 1.0.2
  hono: 4.13.4
  jose: 6.2.10
  safe-stable-stringify: 2.5.0
  standard-matchers: 0.1.0
  uuid: 14.0.2
  valibot: 1.4.2
  viem: 2.55.19
  web-identity-schemas: 0.3.0
  zod: 4.4.3

# Force patched versions of vulnerable transitive dependencies (pnpm audit).
# Scoped by major or range so only the vulnerable lines move.
# https://pnpm.io/settings#overrides
overrides:
  # drizzle-kit -> @esbuild-kit/esm-loader (deprecated) pins esbuild 0.18.x.
  "esbuild@<0.24.3": "^0.25.0"
  # vite 7.3.5 pins esbuild ^0.27 (vulnerable); 7.3.6 allows ^0.28.
  "vite@7": "^7.3.6"
  # express 4 (via mintlify) pins qs 6.14.x.
  "qs@6": "^6.15.2"
  # mintlify pins sharp 0.33.x (libvips CVEs). sharp 0.35 has no install
  # script and loads prebuilt @img/sharp-* binaries, so 0.35 runs at docs
  # build time; verified with `mintlify dev`.
  "sharp@<0.35.0": "^0.35.0"
  # @mintlify/scraping pins puppeteer 24.x, whose @puppeteer/browsers 2.x depends
  # on extract-zip <=2.0.1 (no patched release exists). puppeteer 25 moves to
  # @puppeteer/browsers 3.x, which drops extract-zip. puppeteer is never built
  # here (allowBuilds: false).
  "puppeteer@24": "^25.0.0"

allowBuilds:
  "@scarf/scarf": false
  better-sqlite3: true
  esbuild: true
  keytar: false
  puppeteer: false
  sharp: false
