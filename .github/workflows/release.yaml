name: Release

# Phase 1 of the two-phase changesets release: turn the changesets accumulated
# on main into a version-bump PR. Phase 2 is publish.yaml, dispatched by hand
# once this PR merges.
#
# Runs on every push to main so the release PR stays current as changesets land;
# workflow_dispatch is the "bump" button for refreshing it on demand. When no
# changesets are pending the job exits early and no PR is opened or updated.
#
# The PR is opened with a GitHub App token (ACTIONS_APP_ID /
# ACTIONS_APP_PRIVATE_KEY) rather than the default GITHUB_TOKEN so that the PR
# triggers the check workflow -- GITHUB_TOKEN-authored PRs do not -- matching
# audit-fix.yaml. The app must be installed with contents + pull-requests write.
#
# This deliberately does not use changesets/action: that action needs a
# push-capable token present from checkout onward, whereas the peter-evans flow
# below (already proven in audit-fix.yaml) lets the write-scoped App token be
# minted after dependency install, so it is never in the environment while
# third-party build scripts run.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never cancel in flight: a half-applied `changeset version` that loses its race
# to open the PR would leave the consumed changeset files unaccounted for.
concurrency:
  group: release-version-pr
  cancel-in-progress: false

jobs:
  version-pr:
    name: Open version PR
    if: github.repository == 'agentcommercekit/ack'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Always version main's changesets. Without an explicit ref, a manual
          # workflow_dispatch from a feature branch would check out that branch
          # and leak its changes into the release PR (which targets main).
          ref: main
          persist-credentials: false
          # changeset version reads tags and history to build changelog links.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Check for pending changesets
        id: pending
        run: |
          set -euo pipefail
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "No pending changesets; nothing to version."
          else
            echo "Found $count pending changeset(s)."
          fi

      # @changesets/changelog-github calls the GitHub API to attribute each entry
      # to its PR and author, and hard-fails without a token.
      - name: Apply changesets
        if: steps.pending.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec changeset version

      # The umbrella package depends on all seven scoped packages, so any bump
      # cascades to it, and the `linked` group then aligns it with the rest of
      # the release. That makes its version the release version. Note that
      # `linked` is not `fixed`: packages with no changeset and no changed
      # dependency keep their current version and are not published.
      - name: Read resulting version
        id: version
        if: steps.pending.outputs.count != '0'
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/agentcommercekit/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Minted after install so the contents/pull-requests-write token is never
      # present in the runner environment while dependency build scripts execute.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.pending.outputs.count != '0'
        with:
          app-id: ${{ vars.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update version PR
        if: steps.pending.outputs.count != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: changeset-release/main
          base: main
          delete-branch: true
          title: "chore(release): v${{ steps.version.outputs.version }}"
          commit-message: "chore(release): v${{ steps.version.outputs.version }}"
          labels: release
          body: |
            Version bump generated by `changeset version` from the changesets on `main` (`.github/workflows/release.yaml`).

            The `linked` group in `.changeset/config.json` puts every package in this release on **v${{ steps.version.outputs.version }}**. Packages with no changeset and no changed dependency keep their current version and are not published.

            Review the generated `CHANGELOG.md` entries, then merge. Publishing does **not** happen on merge -- dispatch the [Publish workflow](../../actions/workflows/publish.yaml) from `main` afterwards, which requires an approval on the `npm-publish` environment.

            **AI usage:** none. Generated mechanically by `changeset version`; no AI tools authored these changes (per [AI_POLICY.md](AI_POLICY.md)).

      - name: Summary
        env:
          COUNT: ${{ steps.pending.outputs.count }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Release"
            echo ""
            if [ "$COUNT" = "0" ]; then
              echo "No pending changesets. No version PR opened."
            else
              echo "- Pending changesets: **$COUNT**"
              echo "- Next version: **v$VERSION**"
              echo "- Version PR opened/updated on \`changeset-release/main\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
