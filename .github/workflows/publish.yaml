name: Publish

# Phase 2 of the two-phase changesets release: publish the versions already on
# main to npm. Phase 1 is release.yaml, which opens the version-bump PR.
#
# This is the release button: dispatch it from main after the version PR merges.
# Nothing publishes automatically on merge -- the `verify` job re-runs the full
# check suite and the `publish` job sits behind the `npm-publish` environment,
# so a human approves the actual registry write.
#
# npm auth is OIDC trusted publishing. There is no npm token anywhere in this
# repo, so there is no long-lived publishing credential to leak or rotate, and
# the account's auth-and-writes 2FA no longer blocks an unattended release.
#
# pnpm implements trusted publishing itself -- it does not shell out to the npm
# CLI. It exchanges the GitHub Actions id token for a short-lived registry token
# (releasing/commands/lib/publish/oidc/), and attaches provenance automatically.
# That works through `changeset publish`, which runs `pnpm publish` per package.
#
# The OIDC path is on by default but degrades quietly: pnpm catches a missing
# id token, warns "Skipped OIDC", and falls back to whatever token is
# configured. With no token configured a misconfigured run fails on a 401
# instead of silently publishing with a credential, and the pre-flight check in
# the publish job turns the most likely cause into a clear error first.
#
# Tags are created through the GitHub API rather than `git push`, so no
# push-capable git credential is ever persisted in the runner's checkout.

on:
  workflow_dispatch: {}

permissions: {}

# Never cancel in flight: `changeset publish` walks the packages one at a time
# and a cancelled run leaves a partially published release behind.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    if: github.repository == 'agentcommercekit/ack'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.unpublished.outputs.version }}
      count: ${{ steps.unpublished.outputs.count }}
      packages: ${{ steps.unpublished.outputs.packages }}
      released: ${{ steps.unpublished.outputs.released }}
    steps:
      - name: Refuse if not dispatched from main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Refusing: must dispatch from main, got $REF" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Decide what would be published BEFORE spending 20 minutes on the check
      # suite. Dispatching with nothing to publish is a mistake worth surfacing
      # immediately -- usually it means the version PR was never merged.
      - name: Determine packages to publish
        id: unpublished
        run: node .github/scripts/unpublished-packages.mjs

      - name: Refuse if there is nothing to publish
        env:
          COUNT: ${{ steps.unpublished.outputs.count }}
        run: |
          set -euo pipefail
          if [ "$COUNT" = "0" ]; then
            echo "Refusing: every workspace package version is already on npm." >&2
            echo "Merge the version PR from the Release workflow first." >&2
            exit 1
          fi

      # Verifies the tree that is about to ship, not a cached approximation of
      # it. `check` runs build + lint (including type checking) + format + test.
      - name: Run full check suite
        env:
          ANTHROPIC_API_KEY: secret
          ISSUER_PRIVATE_KEY: "0xa45f5c566918ef954e8c200a96b14092cabcd69cb8a1a132804a2b8cbb8489a1"
          VERIFIER_PRIVATE_KEY: "0xeeca8f89b2f5196126f7d9199e739153bd43a13f9cdd1099e7191a33143a2059"
        run: pnpm run check

      - name: Verify registry signatures of the dependency tree
        run: pnpm audit signatures

      - name: Summary
        env:
          VERSION: ${{ steps.unpublished.outputs.version }}
          COUNT: ${{ steps.unpublished.outputs.count }}
          PACKAGES: ${{ steps.unpublished.outputs.packages }}
          RELEASED: ${{ steps.unpublished.outputs.released }}
        run: |
          {
            echo "## Verify"
            echo ""
            echo "- Release version: **v$VERSION**"
            echo "- Packages to publish: **$COUNT**"
            echo ""
            for package in $PACKAGES; do
              echo "  - \`$package\`"
            done
            echo ""
            echo "Packages the GitHub release will name:"
            echo ""
            for package in $RELEASED; do
              echo "  - \`$package\`"
            done
            echo ""
            echo "Awaiting approval on the \`npm-publish\` environment."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Approval gate. Configure `npm-publish` with required reviewers and limit
    # its deployment branches to `main`. It holds no secrets -- trusted
    # publishing needs none -- so its only job is to stop the registry write
    # until a human approves it.
    environment: npm-publish
    permissions:
      # id-token mints the OIDC token that pnpm exchanges for a short-lived
      # registry token, and that sigstore signs the provenance attestation with.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # changeset publish tags each released package; it needs the existing
          # tags to know which ones already exist.
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm run build

      # pnpm treats a missing id token as a soft failure: it warns "Skipped
      # OIDC" and falls back to a configured token. There is no token here, so
      # the run would fail anyway -- but on a 401 from the registry, which says
      # nothing about the cause. Fail on the real reason instead.
      - name: Confirm OIDC is available
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "Refusing: no OIDC id token. The job needs 'id-token: write'." >&2
            exit 1
          fi

      # changesets creates annotated tags, which need an identity to sign off.
      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Sorted explicitly: `comm` below assumes both inputs are in the same
      # collation order, which git's default refname sort does not guarantee
      # across locales.
      # pipefail matters here: Actions runs `bash -e`, which does not set it, so
      # a failing `git tag --list` piped into a successful `sort` would exit 0
      # and leave an empty baseline. Every existing tag would then look new.
      - name: Record pre-existing tags
        id: tags-before
        run: |
          set -euo pipefail
          git tag --list | LC_ALL=C sort > /tmp/tags-before.txt

      # No .npmrc and no token: pnpm exchanges the id token for a short-lived
      # registry token per package, and attaches provenance on its own. A 401
      # here means the trusted publisher on npmjs.com does not match this
      # repository, this workflow filename, or this environment. A log line
      # reading "Skipped OIDC" means pnpm fell back and the run is publishing
      # unauthenticated -- see RELEASING.md.
      - name: Publish
        run: pnpm exec changeset publish

      # changeset publish tags locally. Create the refs through the API rather
      # than pushing, so the job never holds a push-capable git credential.
      #
      # Runs even when the publish step fails. On a partial failure changesets
      # tags the packages that did publish and only then exits non-zero
      # (changesets-cli.cjs.js: tagPublish() for successes, then ExitError(1)).
      # Skipping this step would destroy those tags with the runner, and a
      # second dispatch could not recreate them -- getUnpublishedPackages()
      # drops packages the registry already has, so changesets never tags them
      # again. The job still ends red; the tags just survive.
      #
      # This does NOT rescue a cancelled run. changesets calls tagPublish() only
      # after the whole publish loop returns, so a process killed part way writes
      # no tags at all. That leaves packages on npm with no tag, which the repair
      # section of RELEASING.md covers. Prefer letting a publish finish red over
      # cancelling it.
      #
      # The outcome guard keeps this step honest when an earlier step failed and
      # /tmp/tags-before.txt was never written -- without it, `comm` dies on the
      # missing file and buries the real failure.
      - name: Push new tags
        id: tags
        if: ${{ always() && steps.tags-before.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git tag --list | LC_ALL=C sort > /tmp/tags-after.txt
          new_tags=$(comm -13 /tmp/tags-before.txt /tmp/tags-after.txt)
          if [ -z "$new_tags" ]; then
            echo "No new tags were created. Check npm before you dispatch again (see RELEASING.md)." >&2
            exit 1
          fi
          for tag in $new_tags; do
            # Singular git/ref/ is the exact-match endpoint; the plural form
            # falls back to prefix matching, which would report a hit for an
            # unrelated longer tag.
            if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists on the remote; skipping."
              continue
            fi
            # Create an annotated tag object rather than a lightweight ref, to
            # match every tag this repo has published so far and to leave
            # something a future `git verify-tag` can check.
            tag_sha=$(gh api -X POST "repos/$REPO/git/tags" \
              -f "tag=$tag" \
              -f "message=$tag" \
              -f "object=$SHA" \
              -f "type=commit" \
              --jq .sha)
            gh api -X POST "repos/$REPO/git/refs" \
              -f "ref=refs/tags/$tag" \
              -f "sha=$tag_sha" >/dev/null
            echo "Created annotated tag $tag at $SHA"
          done
          {
            echo "new_tags<<EOF"
            printf '%s\n' "$new_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # One release per version, not per package: the packages in a release all
      # carry the same version, so one release per package would be noise.
      #
      # Skipped when an earlier step failed, so a partial publish never
      # announces itself as a finished release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          PACKAGES: ${{ needs.verify.outputs.released }}
        run: |
          set -euo pipefail
          tag="agentcommercekit@$VERSION"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi
          notes=$(
            echo "Published to npm:"
            echo ""
            for package in $PACKAGES; do
              echo "- [\`$package@$VERSION\`](https://www.npmjs.com/package/$package/v/$VERSION)"
            done
            echo ""
            echo "See each package's \`CHANGELOG.md\` for the full set of changes."
          )
          # --target pins the release to the published commit. Without it, gh
          # creates a missing tag at the default branch head, which can point
          # the release at a tree that was never published.
          gh release create "$tag" --repo "$REPO" \
            --target "$SHA" \
            --title "v$VERSION" \
            --notes "$notes"

      - name: Summary
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          NEW_TAGS: ${{ steps.tags.outputs.new_tags }}
        run: |
          {
            echo "## Published"
            echo ""
            echo "Release **v$VERSION** is live on npm."
            echo ""
            echo "Tags created:"
            echo ""
            for tag in $NEW_TAGS; do
              echo "- \`$tag\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
